<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>웹 페이지의 구성 요소</title>
<style>
  body { background-color: #ebdccc; }
  h3 { text-align : center; color : darkred; }
  hr { border: none; border-top: 10px solid gray; }
  span { color : violet; font-weight: bold; cursor: pointer; }
</style>
<script>
   
    function showImage() {
        document.getElementById('myImage').src = 'shrek.jpg'; 
        document.getElementById('myImage').style.display = 'block';
    }
    
    function hideImage() {
        document.getElementById('myImage').style.display = 'none';
    }
</script>
</head>
<body>
<h3>Elvis Presley</h3>
<hr>

<img id="myImage" src="" alt="내 사진" style="display:none; width:150px; margin-bottom: 10px;">

He was an American singer and actor. In November 1956, he made his film debut in 
<span onmouseover="showImage()" onmouseout="hideImage()">Love Me Tender</span>. 

He is often referred to as "<span>the King of Rock and Roll</span>".
</body>
</html>
