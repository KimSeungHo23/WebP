<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도형 서식 폼 만들기</title>
</head>
<body>
    <h3>도형 서식 폼 만들기</h3>
    <hr>
    <form>
        <fieldset>
            <legend>도형 서식 입력</legend>
            <label>선종류 
                <select size="3">
                    <option>선없음</option>
                    <option selected>실선</option>
                    <option>점선</option>
                </select>
            </label><br><br>
            <label>선두께 <input type="number"></label>
            <label>선색 <input type="color" value="#4A86E8"></label>
        </fieldset>
        <br>
        <label>투명도(0~100) : <input type="range" min="0" max="100"></label>
    </form>
</body>
</html>
