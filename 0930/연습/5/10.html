<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>애니메이션</title>
    <style>
        @keyframes slide {
            from { margin-left: 100%; }
            to { margin-left: 0%; }
        }
        p {
            animation: slide 3s 1;
            width: fit-content;
            background-color: lightgray;
            padding: 5px;
        }
        img {
            vertical-align: middle;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h3>애니메이션 응용</h3>
    <hr>
    <p><img src="question.png" width="20" alt="질문"> 질문 있습니다.</p>
</body>
</html>
