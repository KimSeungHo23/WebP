<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>리스트로 수직 메뉴 만들기</title>
    <style>
        ul {
            list-style-type: none;
            padding: 0;
            width: 150px;
            background-color: darkseagreen;
        }
        li {
            padding: 5px 10px;
            color: white;
        }
        li:hover {
            background-color: yellowgreen;
            color: magenta;
        }
    </style>
</head>
<body>
    <ul>
        <li>Home</li>
        <li>Espresso</li>
        <li>Cappuccino</li>
        <li>Cafe Latte</li>
        <li>F.A.Q</li>
    </ul>
</body>
</html>
