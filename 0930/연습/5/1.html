<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>div 활용</title>
    <style>
        .box1 { display: inline-block; width: 200px; border: 1px solid yellowgreen; }
        .box2 { display: inline; border: 1px solid yellowgreen; }
    </style>
</head>
<body>
    <h3>3 개의 div 활용</h3>
    <hr>
    <!-- (1)번 출력 모양 -->
    <div class="box1">캔버스에 이미지를 그리기 위해서는 이미지를 담을 객체가 먼저 필요하다.</div>
    <div class="box1">Image 객체의 src 프로퍼티를 이용하여 비트맵을 로드한다.</div>
    <div class="box1">이미지 로딩이 끝나면 그때 비로소 이미지의 너비와 높이가 제대로 알려진다.</div>
    
    <br><br><br>
    
    <!-- (2)번 출력 모양 -->
    <div class="box2">캔버스에 이미지를 그리기 위해서는 이미지를 담을 객체가 먼저 필요하다.</div>
    <div class="box2">Image 객체의 src 프로퍼티를 이용하여 비트맵을 로드한다.</div>
    <div class="box2">이미지 로딩이 끝나면 그때 비로소 이미지의 너비와 높이가 제대로 알려진다.</div>
</body>
</html>
