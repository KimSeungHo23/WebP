<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>산수를 풀어 봅시다</title>
<style>
td {
	padding-left : 10px;
	padding-right : 10px;
}
</style>
<script>
let time = 10;
let timerID = null;

function calc() {
	let total = 0;
	let qArray = document.getElementsByClassName("question");
	let aArray = document.getElementsByClassName("answer");
	for (let i = 0; i < qArray.length; i++) {
		let question = qArray[i].innerHTML;
		let correctAnswer = Math.floor(eval(question));
		let userAnswer = aArray[i].value;
		if (userAnswer == "" || isNaN(userAnswer)) {
			total += 0;
			qArray[i].style.textDecoration = "line-through";
		} else if (parseInt(userAnswer) == correctAnswer) {
			total += 1;
			qArray[i].style.textDecoration = "none";
		} else {
			total += 0;
			qArray[i].style.textDecoration = "line-through";
		}
	}
	document.getElementById("score").innerHTML = total;
}

function countDown() {
	time--;
	document.getElementById("time").innerHTML = time;
	if (time == 0) {
		clearInterval(timerID);
		timerID = null;
		calc();
	}
}

function makeExpression() {
	if (timerID != null) {
		clearInterval(timerID);
	}
	time = 10;
	document.getElementById("time").innerHTML = time;
	let qArray = document.getElementsByClassName("question");
	let aArray = document.getElementsByClassName("answer");
	let operators = ["+", "-", "*", "/"];
	for (let i = 0; i < qArray.length; i++) {
		let number1 = Math.floor(Math.random() * 20) + 1;
		let number2 = Math.floor(Math.random() * 20) + 1;
		let op = operators[Math.floor(Math.random() * 4)];
		qArray[i].innerHTML = number1 + op + number2;
		qArray[i].style.textDecoration = "none";
		aArray[i].value = "";
	}
	document.getElementById("score").innerHTML = 0;
	timerID = setInterval("countDown()", 1000);
}
</script>
</head>
<body onload="makeExpression()">
<h3>산수 문제를 풀어 봅시다.</h3>
<p>문제는 자동으로 생성되며, 10초가 지나면 자동 채점됩니다.<br>
남은 시간 <span id="time">10</span></p>
<hr>
<form>
<table>
<tr><td class="question"></td><td><input class="answer" type="text" size="8"></td></tr>
<tr><td class="question"></td><td><input class="answer" type="text" size="8"></td></tr>
<tr><td class="question"></td><td><input class="answer" type="text" size="8"></td></tr>
<tr><td class="question"></td><td><input class="answer" type="text" size="8"></td></tr>
<tr>
	<td><button type="button" onclick="makeExpression()">다시</button></td>
	<td><span id="score">0</span></td>
</tr>
</table>
</form>
</body>
</html>
