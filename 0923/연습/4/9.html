<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>text-shadow와 box-shadow</title>
    <style>
        h2 {
            text-align: center;
            color: cadetblue;
            text-shadow: 2px 2px 5px yellow;
        }
        img {
            width: 150px;
            margin-right: 10px;
            transition: 0.3s;
        }
        img:hover {
            box-shadow: 5px 5px 10px gray;
        }
    </style>
</head>
<body>
    <h2>Most Visited Pages</h2>
    <hr>
    <img src="naver.png" alt="NAVER">
    <img src="chosun.png" alt="조선일보">
    <img src="amazon.png" alt="Amazon">
</body>
</html>
